[package]
name = "eujev"
version = "0.1.0"
edition = "2021"
description = "A typed Rust SDK for the eu/jev System One API"
license = "MIT"
readme = "README.md"
homepage = "https://jev.bevel.software"
repository = "https://github.com/Raezil/rs-eujev"
keywords = ["eujev", "sdk", "inference", "classification"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = []
blocking = ["reqwest/blocking"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[[example]]
name = "blocking"
required-features = ["blocking"]
